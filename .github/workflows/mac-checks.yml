name: Mac checks
on:
  pull_request:
    branches: [main]
  push:
    branches: [main]
permissions:
  contents: read
jobs:
  checks:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Native and Telegram regressions (mocked services)
        run: |
          bash tests/task-power.sh
          bash tests/computer-control.sh
          bash tests/desktop-input.sh
          bash tests/observations.sh
          bash tests/background-tasks.sh
          bash tests/native-lane.sh
          bash tests/task-context.sh
          bash tests/task-memory.sh
          bash tests/route-memory.sh
          bash tests/delegation.sh
          bash tests/delegation-worker.sh
          bash tests/browser-navigation.sh
          bash tests/action-contract.sh
          bash tests/browser-correlation.sh
          bash tests/image-assets.sh
          bash tests/telegram.sh
          bash tests/telegram-ui.sh
          bash tests/notifier.sh
          bash tests/run-supervisor.sh
          bash tests/asking-policy.sh
          bash tests/ax-tree-budget.sh
          bash tests/control-socket.sh
          bash tests/settle-wait.sh
          python3 tests/benchmarks/test_scoring.py
          bash tests/scheduler.sh
          bash tests/router.sh
          bash tests/data-stores.sh
      - name: Build the Mac app sources
        run: swift build -c release
      - name: Extension and download routing
        run: |
          node tests/extension-version.mjs
          node tests/extension-background.mjs
          node tests/extension-activity.mjs
          node tests/extension-gestures.mjs
          node tests/extension-images.mjs
          node tests/extension-frames.mjs
          node tests/extension-transport.mjs
          node tests/extension-receipt.mjs
          node tests/extension-checkbox.mjs
          node tests/extension-checkbox-label.mjs
          node tests/extension-upload.mjs
          node tests/extension-adopt.mjs
          node tests/extension-popup.mjs
          node tests/telegram-screenshot.mjs
          node tests/mac-download.mjs
