<!doctype html>
<html><head><meta charset="utf-8"><title>Backend Intern | Acme</title>
<style>
  body { font: 15px system-ui; margin: 0; background: #f3f2ef; }
  header { padding: 24px 40px; background: #fff; }
  .backdrop { position: fixed; inset: 0; background: rgba(0,0,0,.55); display: none; }
  .modal { position: fixed; left: 50%; top: 50%; transform: translate(-50%,-50%); width: 520px; height: 440px;
           background: #fff; border-radius: 10px; display: none; flex-direction: column; }
  .modal h2 { margin: 0; padding: 16px 20px; border-bottom: 1px solid #ddd; font-size: 18px; }
  .body { flex: 1; overflow-y: auto; padding: 16px 20px; }
  .body label { display: block; margin: 14px 0 4px; }
  .body input, .body select { width: 100%; padding: 8px; box-sizing: border-box; }
  .spacer { height: 260px; color: #888; }
  footer { border-top: 1px solid #ddd; padding: 12px 20px; text-align: right; }
  footer button, .apply { padding: 8px 18px; border-radius: 16px; border: 0; background: #0a66c2; color: #fff; font-size: 15px; }
  .confirm { position: fixed; left: 50%; top: 40%; transform: translate(-50%,-50%); background: #fff; padding: 20px;
             border-radius: 8px; display: none; box-shadow: 0 4px 20px rgba(0,0,0,.3); }
</style></head>
<body>
<header><h1>Backend Intern</h1><p>Acme · Mumbai (Hybrid)</p><button class="apply" id="open">Easy Apply</button></header>
<div class="backdrop" id="backdrop"></div>
<div class="modal" id="modal" role="dialog" aria-modal="true" aria-label="Apply to Acme">
  <h2 id="stepTitle">Apply to Acme · Contact info</h2>
  <div class="body" id="body"></div>
  <footer><button id="next">Next</button></footer>
</div>
<div class="confirm" id="confirm" role="alertdialog" aria-label="Save this application?">
  <p>Save this application?</p><button id="discard">Discard</button> <button id="save">Save</button>
</div>
<script>
// A LinkedIn-style Easy Apply: a modal whose body scrolls with Next below the fold, a backdrop that closes the
// modal (and asks to save) when clicked, and a note inserted above the fields after typing, which shifts
// positions. The title records what happened so tests/run.sh can check it.
const state = { phone: "", city: "", years: "", ctc: "", backdrop: 0, step: 0 };
const steps = [
  { title: "Contact info", html: `
      <label for="phone">Mobile phone number *</label><input id="phone" required>
      <label for="city">City *</label><input id="city" required>
      <div class="spacer">(More details below)</div>` },
  { title: "Screening questions", html: `
      <label for="years">Years of experience with Python *</label>
      <select id="years" required><option value="">Select an option</option><option>0</option><option>1</option><option>2</option><option>3+</option></select>
      <label for="ctc">Current CTC (INR) *</label><input id="ctc" required>
      <div class="spacer">(Scroll to continue)</div>` },
  { title: "Review", html: `<p>Review your application, then submit.</p>` },
];
const $ = (id) => document.getElementById(id);
function record() {
  document.title = `applied:${state.step >= 3 ? "yes" : "no"}|phone=${state.phone}|city=${state.city}|years=${state.years}|ctc=${state.ctc}|backdrop=${state.backdrop}`;
}
function show(i) {
  state.step = i;
  if (i >= steps.length) { $("modal").style.display = "none"; $("backdrop").style.display = "none"; state.step = 3; record(); return; }
  $("stepTitle").textContent = "Apply to Acme · " + steps[i].title;
  $("body").innerHTML = steps[i].html;
  $("body").scrollTop = 0;
  $("next").textContent = i === steps.length - 1 ? "Submit application" : "Next";
  for (const el of $("body").querySelectorAll("input, select")) {
    el.addEventListener("change", () => { state[el.id] = el.value; record(); });
    el.addEventListener("input", () => {
      state[el.id] = el.value; record();
      if (!$("tip")) {   // like LinkedIn's toasts: content appears above the fields after the first keystroke
        const tip = document.createElement("p"); tip.id = "tip"; tip.textContent = "Tip: recruiters see this.";
        $("body").prepend(tip);
      }
    });
  }
  record();
}
$("open").onclick = () => { $("modal").style.display = "flex"; $("backdrop").style.display = "block"; show(0); };
$("next").onclick = () => {
  const missing = [...$("body").querySelectorAll("[required]")].filter((e) => !e.value);
  if (missing.length) { missing[0].setAttribute("aria-invalid", "true"); return; }
  show(state.step + 1);
};
$("backdrop").onclick = () => { state.backdrop++; $("modal").style.display = "none"; $("confirm").style.display = "block"; record(); };
$("discard").onclick = $("save").onclick = () => { $("confirm").style.display = "none"; $("backdrop").style.display = "none"; };
record();
</script>
</body></html>
