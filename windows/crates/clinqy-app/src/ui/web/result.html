<!doctype html>
<html>
<head>
<meta charset="utf-8">
<title>Clinqy result</title>
<style>/*SHARED_CSS*/</style>
<style>
  /* The result card on the right, as in ResultView (UI.swift). Clickable, never takes focus. */
  .card { margin: 0; border-radius: 18px; overflow: hidden; background: rgba(12, 12, 14, 0.94); box-shadow: inset 0 0 0 1px var(--hairline); }
  .head { display: flex; align-items: center; gap: 8px; padding: 13px 16px; }
  .head .ic { font-size: 12px; color: var(--accent); flex: none; }
  .head .title { flex: 1; font-size: 14px; font-weight: 600; color: var(--text); overflow: hidden; display: -webkit-box; -webkit-line-clamp: 2; -webkit-box-orient: vertical; }
  .head button { font-size: 11px; color: var(--secondary); padding: 2px; }
  .head button:hover { color: var(--text); }
  .hair { height: 1px; background: var(--hairline); }
  .scroll { max-height: 540px; overflow-y: auto; padding: 14px; display: flex; flex-direction: column; gap: 8px; }
  .text { font-size: 13px; color: var(--text); white-space: pre-wrap; user-select: text; }
  .text code { font: 12px Consolas, monospace; background: rgba(255,255,255,0.08); padding: 0 4px; border-radius: 4px; }
  .item { display: flex; align-items: flex-start; gap: 10px; padding: 10px 12px; border-radius: 10px; background: rgba(255,255,255,0.05); user-select: text; transition: background .12s; }
  .item:hover { background: rgba(255,255,255,0.09); }
  .item.link { cursor: pointer; }
  .item .body { flex: 1; min-width: 0; display: flex; flex-direction: column; gap: 3px; }
  .item .t { font-size: 13px; font-weight: 600; color: var(--text); }
  .item .s { font-size: 12px; color: var(--secondary); }
  .item .d { font: 600 13px var(--rounded); color: var(--accent); text-align: right; flex: none; }
  .item .go { font-size: 10px; color: var(--tertiary); flex: none; padding-top: 2px; }
</style>
</head>
<body>
<div class="card" id="card"></div>
<script>/*ICONS_JS*/</script>
<script>
const esc = (s) => String(s ?? "").replace(/[&<>"]/g, (c) => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;" }[c]));
const send = (o) => window.ipc.postMessage(JSON.stringify(o));
// Inline markdown, as SwiftUI renders it: **bold**, *italic*, `code`, [links](…).
const md = (s) => esc(s).replace(/\*\*(.+?)\*\*/g, "<b>$1</b>").replace(/(^|[^*])\*([^*\n]+)\*/g, "$1<i>$2</i>").replace(/`([^`]+)`/g, "<code>$1</code>")
  .replace(/\[([^\]]+)\]\((https?:[^)]+)\)/g, '<a href="#" data-link="$2">$1</a>');
let copied = false, card = null;
function render() {
  if (!card) { document.getElementById("card").innerHTML = ""; return; }
  document.getElementById("card").innerHTML = `<div class="head"><span class="ic">${icon("sparkles")}</span><span class="title">${esc(card.title)}</span>
      <button id="copy" title="Copy">${icon(copied ? "checkmark" : "doc.on.doc")}</button><button id="close" title="Close">${icon("xmark")}</button></div>
    <div class="hair"></div>
    <div class="scroll">${card.text ? `<div class="text">${md(card.text)}</div>` : ""}${card.items.map((i) => `<div class="item ${i.link ? "link" : ""}" ${i.link ? `data-link="${esc(i.link)}"` : ""}>
      <div class="body"><div class="t">${esc(i.title)}</div>${i.subtitle ? `<div class="s">${esc(i.subtitle)}</div>` : ""}</div>
      ${i.detail ? `<div class="d">${esc(i.detail)}</div>` : ""}${i.link ? `<span class="go">${icon("arrow.up.right")}</span>` : ""}</div>`).join("")}</div>`;
  document.getElementById("copy").onclick = () => { send({ type: "copy" }); copied = true; render(); setTimeout(() => { copied = false; render(); }, 1200); };
  document.getElementById("close").onclick = () => send({ type: "dismiss" });
  requestAnimationFrame(() => send({ type: "resize", height: document.getElementById("card").getBoundingClientRect().height }));
}
document.addEventListener("click", (e) => {
  const a = e.target.closest("[data-link]");
  if (a && !window.getSelection().toString()) { e.preventDefault(); send({ type: "link", url: a.dataset.link }); }
});
window.clinqy = { update(c) { card = c; render(); } };
send({ type: "ready" });
</script>
</body>
</html>
