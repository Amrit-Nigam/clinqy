<!doctype html>
<html>
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width">
<title>Clinqy</title>
<style>
  :root {
    --bg: #17171a; --panel: #1f1f24; --line: #2c2c33; --text: #ececf1; --dim: #9a9aa6; --faint: #6b6b76;
    --accent: #3b82f6; --accent2: #60a5fa; --ok: #22c55e; --bad: #ef4444; --warn: #f59e0b; --think: #8b5cf6;
  }
  * { box-sizing: border-box; }
  html, body { margin: 0; height: 100%; background: var(--bg); color: var(--text); overflow: hidden;
    font: 14px/1.45 "Segoe UI Variable Text", "Segoe UI", system-ui, sans-serif; user-select: none; }
  #app { display: flex; flex-direction: column; height: 100%; }
  .top { display: flex; align-items: center; gap: 10px; padding: 14px 16px 12px; -webkit-app-region: drag; }
  .mark { width: 22px; height: 22px; flex: none; }
  .mark svg { width: 22px; height: 22px; }
  #input { flex: 1; background: transparent; border: 0; outline: 0; color: var(--text); font: 18px "Segoe UI Variable Display", "Segoe UI", sans-serif;
    -webkit-app-region: no-drag; user-select: text; min-width: 0; }
  #input::placeholder { color: var(--faint); }
  .icon-btn { -webkit-app-region: no-drag; width: 32px; height: 32px; border-radius: 9px; border: 1px solid var(--line); background: var(--panel);
    color: var(--dim); display: grid; place-items: center; cursor: pointer; flex: none; }
  .icon-btn:hover { color: var(--text); border-color: #3a3a44; }
  .icon-btn.on { color: #fff; background: var(--accent); border-color: var(--accent); }
  .icon-btn.rec { color: #fff; background: var(--ok); border-color: var(--ok); animation: pulse 1.2s infinite; }
  .icon-btn svg { width: 16px; height: 16px; }
  @keyframes pulse { 50% { box-shadow: 0 0 0 6px rgba(34,197,94,.18); } }
  .body { flex: 1; overflow-y: auto; padding: 0 16px; }
  .body::-webkit-scrollbar { width: 8px; } .body::-webkit-scrollbar-thumb { background: #33333b; border-radius: 4px; }
  .hint { color: var(--faint); font-size: 12.5px; padding: 2px 0 10px; }
  .hint b { color: var(--dim); font-weight: 600; }
  .q { background: var(--panel); border: 1px solid var(--line); border-radius: 12px; padding: 12px 14px; margin: 4px 0 10px; }
  .q .label { font-size: 11px; letter-spacing: .06em; text-transform: uppercase; color: var(--accent2); margin-bottom: 4px; }
  .q .text { font-size: 15px; white-space: pre-wrap; user-select: text; }
  .opts { display: flex; flex-wrap: wrap; gap: 8px; margin-top: 10px; }
  .opt { border: 1px solid #3a3a44; background: #26262d; color: var(--text); border-radius: 999px; padding: 6px 13px; cursor: pointer; font: inherit; font-size: 13px; }
  .opt:hover { border-color: var(--accent); }
  .opt.primary { background: var(--accent); border-color: var(--accent); color: #fff; }
  .steps { list-style: none; margin: 4px 0 10px; padding: 0; }
  .steps li { display: flex; gap: 9px; align-items: flex-start; padding: 4px 0; color: var(--dim); font-size: 13px; }
  .steps li .dot { width: 8px; height: 8px; border-radius: 50%; margin-top: 6px; flex: none; background: var(--faint); }
  .steps li.running { color: var(--text); } .steps li.running .dot { background: var(--accent); animation: blink 1s infinite; }
  .steps li.ok .dot { background: var(--ok); } .steps li.failed .dot { background: var(--bad); } .steps li.failed { color: #f3b4b4; }
  .steps li.info .dot { background: var(--think); }
  @keyframes blink { 50% { opacity: .35; } }
  .answer { background: var(--panel); border: 1px solid var(--line); border-radius: 12px; padding: 12px 14px; margin: 6px 0 12px; white-space: pre-wrap; user-select: text; }
  .answer.bad { border-color: #5b2a2a; }
  .review .row { display: flex; justify-content: space-between; gap: 14px; padding: 6px 0; border-bottom: 1px solid var(--line); font-size: 13px; }
  .review .row:last-child { border-bottom: 0; }
  .review .k { color: var(--dim); max-width: 55%; } .review .v { text-align: right; user-select: text; } .review .v.empty { color: var(--warn); }
  .list .item { padding: 9px 10px; border-radius: 10px; cursor: pointer; display: flex; gap: 10px; align-items: center; }
  .list .item:hover, .list .item.sel { background: #26262d; }
  .list .item .t { flex: 1; min-width: 0; } .list .item .t div:first-child { white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .list .item .s { color: var(--faint); font-size: 12px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .list .item .acts { display: none; gap: 6px; } .list .item:hover .acts { display: flex; }
  .mini { border: 1px solid #3a3a44; background: #26262d; color: var(--dim); border-radius: 7px; padding: 3px 8px; font: inherit; font-size: 12px; cursor: pointer; }
  .mini:hover { color: var(--text); border-color: var(--accent); }
  .badge { width: 8px; height: 8px; border-radius: 50%; flex: none; } .badge.ok { background: var(--ok); } .badge.bad { background: var(--bad); }
  .foot { display: flex; align-items: center; gap: 4px; padding: 8px 12px; border-top: 1px solid var(--line); color: var(--faint); font-size: 12px; }
  .tab { padding: 4px 10px; border-radius: 7px; cursor: pointer; } .tab:hover { color: var(--text); } .tab.on { color: var(--text); background: #26262d; }
  .spacer { flex: 1; }
  .pill { display: inline-flex; align-items: center; gap: 6px; padding: 3px 9px; border-radius: 999px; border: 1px solid var(--line); cursor: pointer; }
  .pill.on { color: #fff; border-color: var(--warn); background: rgba(245,158,11,.18); }
  .empty { color: var(--faint); font-size: 13px; padding: 14px 4px; }
  .listen { display: flex; align-items: center; gap: 10px; color: var(--dim); padding: 6px 0 12px; }
  .bars { display: flex; gap: 3px; align-items: center; height: 18px; } .bars i { width: 3px; background: var(--ok); border-radius: 2px; height: 4px; transition: height .08s; }
  a { color: var(--accent2); }
  .kbd { border: 1px solid #3a3a44; border-bottom-width: 2px; border-radius: 5px; padding: 0 5px; font-size: 11.5px; color: var(--dim); }
</style>
</head>
<body>
<div id="app">
  <div class="top">
    <div class="mark"><svg viewBox="0 0 24 24"><defs><linearGradient id="g" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#93c5fd"/><stop offset="1" stop-color="#3b82f6"/></linearGradient></defs><path d="M5 3v15l3.6-3.4 2.8 6.2 2.7-1.2-2.8-6.1H16z" fill="url(#g)" stroke="#fff" stroke-width="1.2" stroke-linejoin="round"/></svg></div>
    <input id="input" placeholder="What should I do?" autocomplete="off" spellcheck="false">
    <button class="icon-btn" id="mic" title="Talk (or hold the hotkey)"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><rect x="9" y="3" width="6" height="11" rx="3"/><path d="M5 11a7 7 0 0 0 14 0M12 18v3"/></svg></button>
    <button class="icon-btn" id="stop" title="Stop" style="display:none"><svg viewBox="0 0 24 24" fill="currentColor"><rect x="6" y="6" width="12" height="12" rx="2"/></svg></button>
  </div>
  <div class="body" id="body"></div>
  <div class="foot">
    <span class="tab" data-tab="home">Home</span>
    <span class="tab" data-tab="history">History</span>
    <span class="tab" data-tab="skills">Skills</span>
    <span class="spacer"></span>
    <span class="pill" id="dry" title="Show every click and keystroke without doing them">Dry run</span>
    <span id="model" style="margin-left:8px"></span>
  </div>
</div>
<script>
const $ = (s) => document.querySelector(s);
const send = (o) => window.ipc.postMessage(JSON.stringify(o));
const esc = (s) => String(s ?? "").replace(/[&<>"]/g, (c) => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;" }[c]));
let state = { snap: null, history: [], workflows: [], skills: [], tab: "home", listening: false, transcript: "", hotkey: "Ctrl+Alt", model: "" };
let sel = -1;

function layout() {
  // Ask for the height the content needs (bar grows and shrinks like Spotlight's).
  const body = $("#body");
  const want = Math.min(560, 64 + (body.scrollHeight ? body.scrollHeight + 6 : 0) + 41);
  send({ type: "resize", height: Math.max(state.compact ? 64 : 150, want) });
}

function stepHtml(st) {
  return `<ul class="steps">${st.map((s) => `<li class="${s.state}"><span class="dot"></span><span>${esc(s.text)}</span></li>`).join("")}</ul>`;
}

function render() {
  const s = state.snap || {};
  const body = $("#body");
  const running = !!s.running;
  $("#stop").style.display = running ? "" : "none";
  $("#dry").classList.toggle("on", !!s.dry_run);
  $("#mic").classList.toggle("rec", !!state.listening);
  $("#model").textContent = state.model || "";
  document.querySelectorAll(".tab").forEach((t) => t.classList.toggle("on", t.dataset.tab === state.tab));
  let html = "";
  if (state.listening) {
    html += `<div class="listen"><div class="bars">${"<i></i>".repeat(5)}</div><span>${esc(state.transcript || "Listening… release the hotkey (or click the mic) when you're done")}</span></div>`;
  }
  if (s.review) {
    html += `<div class="q review"><div class="label">Check before submitting</div><div class="text" style="font-weight:600;margin-bottom:6px">${esc(s.review.title)}</div>`
      + s.review.items.map(([k, v]) => `<div class="row"><span class="k">${esc(k)}</span><span class="v ${v ? "" : "empty"}">${esc(v || "(empty)")}</span></div>`).join("")
      + `<div class="opts"><button class="opt primary" data-review="submit">Submit</button><button class="opt" data-review="edit">Edit…</button></div></div>`;
    $("#input").placeholder = "Or type what to change, then Enter";
  } else if (s.question) {
    html += `<div class="q"><div class="label">Clinqy needs your input</div><div class="text">${esc(s.question.text)}</div>`
      + (s.question.options.length ? `<div class="opts">${s.question.options.map((o, i) => `<button class="opt ${i === 0 ? "primary" : ""}" data-answer="${esc(o)}">${esc(o)}</button>`).join("")}</div>` : "")
      + `</div>`;
    $("#input").placeholder = s.question.sensitive ? "Type it (hidden), then Enter" : "Type your answer, then Enter";
    $("#input").type = s.question.sensitive ? "password" : "text";
  } else {
    $("#input").type = "text";
    $("#input").placeholder = running ? "Add something, or change the plan…" : "What should I do?";
  }
  if (state.tab === "history" && !s.question && !s.review) {
    html += `<div class="list">${state.history.length ? state.history.map((h, i) => `<div class="item ${i === sel ? "sel" : ""}" data-hist="${i}">
      <span class="badge ${h.ok ? "ok" : "bad"}"></span><div class="t"><div>${esc(h.request)}</div><div class="s">${esc(h.answer)}</div></div>
      <div class="acts"><button class="mini" data-cont="${esc(h.id)}">Continue</button><button class="mini" data-again="${esc(h.id)}">Run again</button>${h.trace ? `<button class="mini" data-savewf="${esc(h.id)}">Save workflow</button>` : ""}</div></div>`).join("") : `<div class="empty">Nothing yet — your requests show up here.</div>`}</div>`;
  } else if (state.tab === "skills" && !s.question && !s.review) {
    html += `<div class="list">`;
    html += state.workflows.length ? `<div class="hint"><b>Workflows</b> — replayed with no model</div>` + state.workflows.map((w) => `<div class="item"><div class="t"><div>${esc(w.name)}</div><div class="s">${w.steps} steps · run ${w.runs}×${w.schedule ? " · daily " + esc(w.schedule) : ""}</div></div>
      <div class="acts"><button class="mini" data-runwf="${esc(w.name)}">Run</button><button class="mini" data-daily="${esc(w.id)}">Daily…</button><button class="mini" data-delwf="${esc(w.id)}">Delete</button></div></div>`).join("") : "";
    html += state.skills.length ? `<div class="hint" style="margin-top:8px"><b>Skills</b> — learned by watching you</div>` + state.skills.map((k) => `<div class="item"><div class="t"><div>${esc(k.name)}</div><div class="s">${esc(k.summary)}</div></div><div class="acts"><button class="mini" data-delskill="${esc(k.id)}">Delete</button></div></div>`).join("") : "";
    if (!state.workflows.length && !state.skills.length) html += `<div class="empty">No skills or workflows yet. In History, hover a run that worked and click <b>Save workflow</b>; or use <b>Watch &amp; learn</b> from the tray menu.</div>`;
    html += `</div>`;
  } else {
    if ((s.steps || []).length && (running || s.question || s.review || state.tab === "home")) html += stepHtml(s.steps.slice(-12));
    if (!running && s.answer && !s.question) html += `<div class="answer ${s.phase === "failed" ? "bad" : ""}">${esc(s.answer)}</div>`;
    if (!running && !(s.steps || []).length && !state.listening) {
      html += `<div class="hint">Type or say what you want — <b>Enter</b> to go, <b>Esc</b> to close. Tap <span class="kbd">${esc(state.hotkey)}</span> anytime to open this bar, hold it to talk.
        Try: “open youtube and search lofi”, “where's the bluetooth setting?”, “what's on this page?”</div>`;
    }
  }
  body.innerHTML = html;
  state.compact = !html.trim();
  requestAnimationFrame(layout);
}

window.clinqy = {
  update(o) { Object.assign(state, o); render(); },
  level(l) { document.querySelectorAll(".bars i").forEach((b, i) => b.style.height = Math.max(4, Math.min(18, l * 30 * (0.6 + ((i * 37) % 5) / 6))) + "px"); },
  focus() { const i = $("#input"); i.focus(); i.select(); },
  clear() { $("#input").value = ""; },
};

$("#input").addEventListener("keydown", (e) => {
  const s = state.snap || {};
  if (e.key === "Escape") { send({ type: "hide" }); return; }
  if (e.key === "Enter") {
    const text = $("#input").value.trim();
    if (s.review) { send({ type: "review", submit: !text, note: text }); $("#input").value = ""; return; }
    if (s.question) { if (text || s.question.options.length) send({ type: "answer", text: text || s.question.options[0] }); $("#input").value = ""; return; }
    if (state.tab === "history" && sel >= 0 && !text) { send({ type: "again", id: state.history[sel].id }); return; }
    if (!text) return;
    send({ type: s.running ? "add" : "submit", text });
    $("#input").value = "";
    return;
  }
  if (state.tab === "history" && (e.key === "ArrowDown" || e.key === "ArrowUp")) {
    sel = Math.max(0, Math.min(state.history.length - 1, sel + (e.key === "ArrowDown" ? 1 : -1))); render(); e.preventDefault();
  }
});
$("#mic").onclick = () => send({ type: "mic" });
$("#stop").onclick = () => send({ type: "cancel" });
$("#dry").onclick = () => send({ type: "dry" });
document.querySelectorAll(".tab").forEach((t) => t.onclick = () => { state.tab = t.dataset.tab; sel = -1; send({ type: "tab", tab: state.tab }); render(); $("#input").focus(); });
$("#body").addEventListener("click", (e) => {
  const b = e.target.closest("button,[data-hist]"); if (!b) return;
  const d = b.dataset;
  if (d.answer !== undefined) send({ type: "answer", text: d.answer });
  else if (d.review) { if (d.review === "submit") send({ type: "review", submit: true }); else { $("#input").focus(); $("#input").placeholder = "What should change? Type it, then Enter"; } }
  else if (d.cont) send({ type: "continue", id: d.cont });
  else if (d.again) send({ type: "again", id: d.again });
  else if (d.savewf) send({ type: "savewf", id: d.savewf });
  else if (d.runwf) send({ type: "runwf", name: d.runwf });
  else if (d.delwf) send({ type: "delwf", id: d.delwf });
  else if (d.daily) { const t = prompt("Run it every day at (HH:MM, empty to stop):", "09:00"); if (t !== null) send({ type: "daily", id: d.daily, time: t }); }
  else if (d.delskill) send({ type: "delskill", id: d.delskill });
  else if (d.hist !== undefined) { sel = +d.hist; $("#input").value = state.history[sel].request; $("#input").focus(); render(); }
});
document.addEventListener("keydown", (e) => { if (e.key === "Escape") send({ type: "hide" }); });
send({ type: "ready" });
</script>
</body>
</html>
