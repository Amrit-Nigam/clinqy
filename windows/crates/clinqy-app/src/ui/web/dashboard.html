<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Clinqy Dashboard</title>
<style>
:root{color-scheme:dark;--bg:#111417;--rail:#191f23;--card:#222a2f;--edge:#ffffff12;--text:#edf1f3;--muted:#929da3;--blue:#5794ff;--teal:#40d6bf;--orange:#ffb35c}
*{box-sizing:border-box}html,body{margin:0;width:100%;height:100%;overflow:hidden;background:var(--bg);color:var(--text);font:14px/1.45 "Segoe UI",system-ui,sans-serif}button,input,select{font:inherit;color:inherit}button{cursor:pointer}
.app{height:100%;display:flex}.rail{width:220px;flex:none;background:var(--rail);border-right:1px solid var(--edge);display:flex;flex-direction:column;padding:28px 12px 16px}.brand{display:flex;align-items:center;gap:10px;padding:0 12px 30px;font-size:19px;font-weight:650;letter-spacing:.2px}.brand-mark{width:28px;height:28px;border-radius:9px;background:linear-gradient(145deg,#7c62ff,#459eff);display:grid;place-items:center;font-size:16px;box-shadow:0 5px 18px #508bff55}.nav{display:grid;gap:6px}.nav button{border:0;background:transparent;border-radius:10px;padding:11px 12px;text-align:left;color:#c2cacf;display:flex;align-items:center;gap:12px}.nav button:hover{background:#ffffff0b}.nav button.active{background:#ffffff14;color:#fff}.nav .ico{width:20px;text-align:center;color:#a9bac2;font-size:16px}.privacy{margin-top:auto;padding:14px 10px 0;color:var(--muted);font-size:11px;display:flex;gap:8px;align-items:center}.dot{width:7px;height:7px;border-radius:50%;background:var(--teal);box-shadow:0 0 9px #40d6bf77}
.main{min-width:0;flex:1;display:flex;flex-direction:column}.top{height:76px;flex:none;border-bottom:1px solid var(--edge);padding:13px 30px;display:flex;align-items:center;gap:20px}.headcopy{min-width:0}.top h1{font-size:22px;line-height:1.15;margin:0 0 5px;font-weight:650;letter-spacing:-.35px}.subtitle{font-size:11px;color:var(--muted);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}.topright{margin-left:auto;display:flex;gap:10px;align-items:center}.select{border:1px solid #ffffff18;border-radius:8px;background:#1a2024;padding:8px 11px;font-size:12px}.scroll{overflow:auto;min-height:0;padding:26px 30px 32px}.page{display:none;max-width:1080px;margin:auto}.page.active{display:block}.stack{display:grid;gap:16px}.metrics{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:12px}.card,.metric{background:var(--card);border:1px solid var(--edge);border-radius:15px}.metric{padding:16px 17px;min-height:104px}.metric strong{display:block;font-size:23px;line-height:1.2;letter-spacing:-.4px;margin-bottom:7px}.metric span{display:block;font-size:11px;color:#d6dcdf}.metric small{display:block;margin-top:5px;font-size:10px;color:var(--muted)}.card{padding:18px}.card h2{font-size:14px;margin:0;font-weight:650}.card p{margin:5px 0 0;color:var(--muted);font-size:11px}.cardhead{display:flex;align-items:flex-start;gap:16px}.cardhead .right{margin-left:auto;color:var(--muted);font-size:10px;text-align:right}.twocol{display:grid;grid-template-columns:1fr 1fr;gap:14px}.row{display:flex;align-items:center;gap:12px;padding:10px 0;border-top:1px solid #ffffff0b}.row:first-of-type{margin-top:10px}.rowtitle{font-size:12px;font-weight:600}.rowmeta{font-size:10px;color:var(--muted);margin-top:2px}.spacer{flex:1}.pill{display:inline-flex;align-items:center;border:1px solid #ffffff17;background:#ffffff09;border-radius:7px;padding:6px 9px;font:11px "Cascadia Code",Consolas,monospace;color:#e1e8eb;white-space:nowrap}.muted{color:var(--muted)}.accent{color:var(--blue)}.small{font-size:11px;color:var(--muted)}.btn{border:1px solid #ffffff20;border-radius:8px;background:#ffffff09;padding:7px 12px;font-size:11px}.btn:hover{background:#ffffff14}.btn.primary{background:var(--blue);border-color:var(--blue);color:white;font-weight:600}.btn:disabled{opacity:.4;cursor:not-allowed}.inputs{display:grid;grid-template-columns:1fr 1fr auto;gap:9px;margin-top:13px}.inputs input{min-width:0;border:1px solid #ffffff1b;border-radius:8px;background:#171c20;padding:9px 10px;font-size:11px;outline:none}.inputs input:focus{border-color:#5794ff99}.progress{height:6px;border-radius:10px;background:#ffffff12;overflow:hidden;margin:7px 0 4px}.progress i{height:100%;display:block;border-radius:10px;background:var(--blue)}.progress i.warn{background:var(--orange)}.progressline{margin-top:12px}.progressline .between{display:flex;justify-content:space-between;font-size:11px}.between .muted{font-family:Consolas,monospace}.activity{display:grid;gap:8px;margin-top:14px}.usage-row{display:flex;align-items:center;gap:12px;font-size:11px}.usage-row .name{width:155px;flex:none}.usage-row .track{height:6px;background:#ffffff10;border-radius:8px;flex:1;overflow:hidden}.usage-row .track i{display:block;height:100%;background:linear-gradient(90deg,#547bff,#50c5dc);border-radius:8px}.usage-row .amount{width:95px;text-align:right;font:10px Consolas,monospace;color:var(--muted)}.chart{height:142px;display:flex;align-items:flex-end;gap:7px;padding-top:17px}.barcol{flex:1;height:100%;display:flex;align-items:flex-end;position:relative;min-width:5px}.barcol i{width:100%;min-height:2px;border-radius:4px 4px 1px 1px;background:linear-gradient(180deg,#62b9ff,#5778f5);opacity:.9}.barcol span{position:absolute;bottom:-18px;left:50%;transform:translateX(-50%);font-size:8px;color:#849097;white-space:nowrap}.empty{padding:18px 0 4px;color:var(--muted);font-size:12px}.providerlist{display:grid;gap:0;margin-top:10px}.provider{border-top:1px solid #ffffff0b;padding:12px 0;display:flex;align-items:center;gap:14px}.provider:first-child{border-top:0}.provider .info{min-width:0}.provider .info strong{font-size:12px;display:block}.provider .info small{font-size:10px;color:var(--muted)}.status{min-height:17px;color:#aab5ba;font-size:11px}.warntext{color:var(--orange)}.shortcut{display:grid;grid-template-columns:1fr auto;align-items:center;gap:12px;border-top:1px solid #ffffff0b;padding:13px 0}.shortcut:first-of-type{margin-top:10px}.shortcut .desc strong{font-size:12px;display:block}.shortcut .desc small{color:var(--muted);font-size:10px}.shortcut-actions{display:flex;gap:7px;align-items:center}.section-note{padding:12px;border-radius:9px;background:#ffffff08;color:var(--muted);font-size:11px;margin-top:10px}
@media(max-width:850px){.rail{width:180px}.scroll{padding:20px}.top{padding:12px 20px}.twocol{grid-template-columns:1fr}.metric{padding:13px}.metric strong{font-size:20px}}
</style>
</head>
<body>
<div class="app">
  <aside class="rail">
    <div class="brand"><span class="brand-mark">✳</span><span>clinqy</span></div>
    <nav class="nav">
      <button data-page="Overview" class="active"><span class="ico">⌂</span>Overview</button>
      <button data-page="Usage"><span class="ico">▥</span>Usage</button>
      <button data-page="AI &amp; Model"><span class="ico">✦</span>AI &amp; Model</button>
      <button data-page="Shortcuts"><span class="ico">⌘</span>Shortcuts</button>
    </nav>
    <div class="privacy"><i class="dot"></i><span>Local usage · stored on this PC</span></div>
  </aside>
  <main class="main">
    <header class="top"><div class="headcopy"><h1 id="pageTitle">Overview</h1><div id="subtitle" class="subtitle">—</div></div><div class="topright"><select id="range" class="select"><option value="month">This month</option><option value="thirtyDays">Last 30 days</option><option value="all">All time</option></select></div></header>
    <div class="scroll">
      <section id="overview" class="page active"></section>
      <section id="usage" class="page"></section>
      <section id="providers" class="page"></section>
      <section id="shortcuts" class="page"></section>
    </div>
  </main>
</div>
<script>
(()=>{
  let state={};let page='Overview';let capturing='';let downMods=new Set();let captureMods=new Set();
  const $=id=>document.getElementById(id);const esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
  const post=(type,data={})=>window.ipc&&window.ipc.postMessage(JSON.stringify({type,...data}));
  const fmt=n=>Number(n||0).toLocaleString();const tokenCount=s=>Number(s?.inputTokens||0)+Number(s?.outputTokens||0);
  const pageToId={'Overview':'overview','Usage':'usage','AI & Model':'providers','Shortcuts':'shortcuts'};
  const setPage=name=>{page=name;document.querySelectorAll('.page').forEach(p=>p.classList.toggle('active',p.id===pageToId[name]));document.querySelectorAll('.nav button').forEach(b=>b.classList.toggle('active',b.dataset.page===name));$('pageTitle').textContent=name;$('range').style.display=(name==='Overview'||name==='Usage')?'':'none';render()};
  const metric=(value,title,note)=>`<div class="metric"><strong>${esc(value)}</strong><span>${esc(title)}</span><small>${esc(note)}</small></div>`;
  const progress=(title,used,limit)=>{if(!limit)return `<div class="small">No ${title.toLowerCase()} warning limit set</div>`;const pct=Math.min(100,Math.floor(used*100/limit));return `<div class="progressline"><div class="between"><span>${title}</span><span class="muted">${fmt(used)} / ${fmt(limit)} · ${pct}%</span></div><div class="progress"><i class="${pct>=100?'warn':''}" style="width:${pct}%"></i></div>${pct>=100?`<div class="small warntext">Monthly ${title.toLowerCase()} warning reached · Clinqy will continue to work</div>`:''}</div>`};
  const usageRows=summary=>{const providers=summary?.providers||[];if(!providers.length)return '<div class="empty">Usage tracking starts with your next model request.</div>';const max=Math.max(1,...providers.map(p=>p.requests));return `<div class="activity">${providers.map(p=>`<div class="usage-row"><span class="name">${esc(p.providerName||p.provider)}</span><span class="track"><i style="width:${Math.max(3,p.requests/max*100)}%"></i></span><span class="amount">${fmt(p.requests)} req · ${p.meteredRequests?fmt(Number(p.inputTokens||0)+Number(p.outputTokens||0)):'—'} tok</span></div>`).join('')}</div>`};
  const trend=summary=>{const days=(summary?.days||[]).slice(-14);if(!days.length)return '<div class="empty">Daily activity will appear after your next model request.</div>';if(!summary.meteredRequests)return '<div class="empty">Daily token totals appear for providers that report usage.</div>';const max=Math.max(1,...days.map(d=>tokenCount(d)));return `<div class="chart">${days.map(d=>`<div class="barcol" title="${esc(d.day)} · ${fmt(tokenCount(d))} tokens"><i style="height:${Math.max(2,tokenCount(d)/max*100)}%"></i><span>${esc(d.day.slice(5))}</span></div>`).join('')}</div>`};
  const limitsCard=(summary,limit)=>{const tokenLimit=Number(limit.tokenLimit||0);const tokenRow=tokenLimit&&Number(limit.monthly?.meteredRequests||0)===0?'<div class="small">No provider-reported token totals this month</div>':progress('Tokens',tokenCount(limit.monthly),tokenLimit);return `<div class="card"><div class="cardhead"><div><h2>Monthly usage warnings</h2><p>Request totals are local; tokens are provider-reported · warnings never block use</p></div></div>${tokenRow}${progress('Requests',Number(limit.monthly?.requests||0),Number(limit.requestLimit||0))}<div class="inputs"><input data-limit="tokens" type="number" min="0" step="1" placeholder="Monthly token warning" value="${esc(limit.tokenLimit||'')}"><input data-limit="requests" type="number" min="0" step="1" placeholder="Monthly request warning" value="${esc(limit.requestLimit||'')}"><button class="btn" onclick="window.clinqy.saveLimits()">Save</button></div></div>`};
  const providerCard=()=>`<div class="card"><h2>AI provider</h2><p>Currently answering for Clinqy</p><div style="font-size:17px;font-weight:600;margin-top:15px">${esc(state.currentProviderName||'—')}</div><div class="small" style="margin-top:4px">${esc(state.model||'Provider default')}</div><button class="btn" style="margin-top:14px" onclick="window.clinqy.page('AI & Model')">Manage provider</button></div>`;
  const shortcutCard=()=>`<div class="card"><h2>Shortcuts</h2><div class="row"><span>Summon Clinqy</span><span class="spacer"></span><span class="pill">${esc(state.summonLabel||'—')}</span></div><div class="row"><span>Hold to talk</span><span class="spacer"></span><span class="pill">${esc(state.talkLabel||'Off')}</span></div><button class="btn" onclick="window.clinqy.page('Shortcuts')">Customize shortcuts</button></div>`;
  const status=()=>`<div class="status ${state.status?.startsWith('Couldn\'t')||state.status?.startsWith('Enter')?'warntext':''}">${esc(state.status||'')}</div>`;
  const render=()=>{
    const active=document.activeElement;const activePage=active?.closest?.('.page')?.id;const activeLimit=active?.dataset?.limit;const activeValue=activeLimit?active.value:null;
    const s=state.summary||{};const monthly=state.monthlySummary||{};const limit={monthly,tokenLimit:state.tokenLimit,requestLimit:state.requestLimit};
    $('subtitle').textContent=`${state.currentProviderName||'Provider'} · ${state.model||'Provider default'}`;
    $('range').value=state.range||'month';
    $('overview').innerHTML=`<div class="stack"><div class="metrics">${metric(fmt(s.requests),'Model requests',state.rangeLabel||'This month')}${metric(s.meteredRequests?fmt(s.inputTokens):'—','Input tokens','Reported when available')}${metric(s.meteredRequests?fmt(s.outputTokens):'—','Output tokens','Reported when available')}</div>${limitsCard(s,limit)}<div class="twocol">${providerCard()}${shortcutCard()}</div><div class="card"><div class="cardhead"><div><h2>Provider activity</h2><p>${fmt(s.meteredRequests||0)} of ${fmt(s.requests||0)} requests reported token totals</p></div></div>${usageRows(s)}</div>${status()}</div>`;
    $('usage').innerHTML=`<div class="stack"><div class="metrics">${metric(fmt(s.requests),'Model requests',state.rangeLabel||'This month')}${metric(s.meteredRequests?fmt(s.inputTokens):'—','Input tokens','Reported when available')}${metric(s.meteredRequests?fmt(s.outputTokens):'—','Output tokens','Reported when available')}</div><div class="card"><div class="cardhead"><div><h2>Daily token usage</h2><p>Last 14 active days in this period</p></div></div>${trend(s)}</div>${limitsCard(s,limit)}<div class="card"><div class="cardhead"><div><h2>Usage by provider</h2><p>Local request totals and reported tokens</p></div></div>${usageRows(s)}</div>${status()}</div>`;
    const providers=state.providers||[];
    $('providers').innerHTML=`<div class="stack"><div class="card"><div class="cardhead"><div><h2>AI provider and model</h2><p>Choose which configured model service Clinqy uses.</p></div><div class="right">${state.providerManaged?'Managed by environment':''}</div></div><div class="providerlist">${providers.map(p=>`<div class="provider"><div class="info"><strong>${esc(p.name)}</strong><small>${esc(p.subtitle|| (p.configured?'Ready':'Set up credentials or install this provider'))}</small></div><span class="spacer"></span>${p.id===state.currentProvider?'In use':p.configured&&!state.providerManaged?`<button class="btn" onclick="window.clinqy.chooseProvider('${esc(p.id)}')">Use</button>`:!p.configured?`<button class="btn" onclick="window.clinqy.setup()">Set up</button>`:''}</div>`).join('')}</div>${state.providerManaged?'<div class="section-note">The active provider is set by an environment variable or launch argument.</div>':''}</div>${status()}</div>`;
    $('shortcuts').innerHTML=`<div class="stack"><div class="card"><h2>Summon Clinqy</h2><p>Tap the modifier shortcut to open the command bar.</p><div class="shortcut"><div class="desc"><strong>Summon shortcut</strong><small>Press one or more modifier keys together.</small></div><div class="shortcut-actions"><span class="pill">${esc(state.summonLabel||'—')}</span><button class="btn" onclick="window.clinqy.capture('summon')">Record</button></div></div><div class="shortcut"><div class="desc"><strong>Push to talk</strong><small>Clinqy listens only while this shortcut is held.</small></div><div class="shortcut-actions"><span class="pill">${esc(state.talkLabel||'Off')}</span><button class="btn" onclick="window.clinqy.capture('talk')">Record</button><button class="btn" onclick="window.clinqy.disableTalk()">Turn off</button></div></div><div class="small" style="margin-top:10px">${capturing?`Press ${capturing==='summon'?'modifier keys':'modifier keys and one letter, number, Space, or function key'}…`:''}</div><div style="display:flex;justify-content:flex-end;margin-top:16px"><button class="btn primary" onclick="window.clinqy.saveShortcuts()">Save shortcuts</button></div></div><div class="card"><h2>Current bindings</h2><div class="row"><span>Summon</span><span class="spacer"></span><span class="pill">${esc(state.summonLabel||'—')}</span></div><div class="row"><span>Hold to talk</span><span class="spacer"></span><span class="pill">${esc(state.talkLabel||'Off')}</span></div></div>${status()}</div>`;
    if(activeLimit&&activePage===pageToId[page]){const field=$(activePage)?.querySelector(`[data-limit="${activeLimit}"]`);if(field){field.value=activeValue;field.focus()}}
  };
  window.clinqy={update(next){state=next||{};render()},page:setPage,chooseProvider(id){post('provider',{provider:id})},setup(){post('setup')},capture(kind){if(state.hotkeysManaged){state.status='Shortcuts are managed by environment variables.';render();return}capturing=kind;downMods.clear();captureMods.clear();post('capture',{enabled:true});state.status='Press the shortcut now. Press Escape to cancel.';render()},disableTalk(){state.talkSpec='off';state.talkLabel='Off';render()},saveLimits(){const root=$(pageToId[page]);post('limits',{tokens:root?.querySelector('[data-limit="tokens"]')?.value||'',requests:root?.querySelector('[data-limit="requests"]')?.value||''})},saveShortcuts(){if(state.hotkeysManaged){state.status='Shortcuts are managed by environment variables.';render();return}post('shortcuts',{summon:state.summonSpec||'ctrl+alt',talk:state.talkSpec??''})}};
  document.querySelectorAll('.nav button').forEach(b=>b.addEventListener('click',()=>setPage(b.dataset.page)));
  $('range').addEventListener('change',e=>post('range',{range:e.target.value}));
  window.addEventListener('keydown',e=>{
    if(!capturing)return;
    if(e.key==='Escape'){capturing='';post('capture',{enabled:false});render();return}
    const mod={Control:'ctrl',Alt:'alt',Shift:'shift',Meta:'win'}[e.key];
    if(mod){e.preventDefault();downMods.add(mod);captureMods.add(mod);return}
    if(capturing==='talk'&&downMods.size){let key=e.key===' '||e.code==='Space'?'space':e.key.toLowerCase();if(/^f([1-9]|1[0-2])$/.test(key)||/^[a-z0-9]$/.test(key)){e.preventDefault();state.talkSpec=[...downMods,key].join('+');state.talkLabel=state.talkSpec;capturing='';post('capture',{enabled:false});render()}}
  });
  window.addEventListener('keyup',e=>{const mod={Control:'ctrl',Alt:'alt',Shift:'shift',Meta:'win'}[e.key];if(mod){downMods.delete(mod);if(capturing==='summon'&&downMods.size===0&&captureMods.size){state.summonSpec=['ctrl','alt','shift','win'].filter(m=>captureMods.has(m)).join('+');state.summonLabel=state.summonSpec;capturing='';post('capture',{enabled:false});render()}}});
  setInterval(()=>{if(!capturing&&document.activeElement?.tagName!=='INPUT')post('refresh')},10000);
  post('ready');
})();
</script>
</body>
</html>
