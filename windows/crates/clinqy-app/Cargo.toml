[package]
name = "clinqy-app"
description = "Clinqy for Windows: the tray app (ClinqyApp.exe) and the `clinqy` command for terminals and coding agents."
version.workspace = true
edition.workspace = true
license.workspace = true

[lib]
name = "clinqy_app"
path = "src/lib.rs"

# The app: tray icon, command bar, companion cursor (no console window).
[[bin]]
name = "ClinqyApp"
path = "src/main_app.rs"

# The command: `clinqy run|qa|workflow|page|stats|mcp…`, talking to the running app.
[[bin]]
name = "clinqy"
path = "src/main_cli.rs"

[dependencies]
clinqy-core = { path = "../clinqy-core" }
clinqy-windows = { path = "../clinqy-windows" }
anyhow.workspace = true
base64.workspace = true
chrono.workspace = true
parking_lot.workspace = true
rand.workspace = true
regex.workspace = true
serde.workspace = true
serde_json.workspace = true
tokio.workspace = true
uuid.workspace = true
tao = "0.30"
wry = { version = "0.47", default-features = false, features = ["os-webview"] }
tray-icon = "0.19"
image = { version = "0.25", default-features = false, features = ["png"] }
url = "2"
cpal = "0.15"
futures-util = { version = "0.3", default-features = false, features = ["std"] }
zip = { version = "2", default-features = false, features = ["deflate"] }
reqwest = { version = "0.12", default-features = false, features = ["json", "rustls-tls", "stream", "multipart"] }

[dependencies.windows]
version = "0.58"
features = [
    "Win32_Foundation",
    "Win32_Graphics_Dwm",
    "Win32_Graphics_Gdi",
    "Win32_Security",
    "Win32_System_Console",
    "Win32_System_Diagnostics_Debug",
    "Win32_System_Threading",
    "Win32_System_Registry",
    "Win32_UI_WindowsAndMessaging",
    "Win32_UI_Input_KeyboardAndMouse",
    "Win32_Media_Audio",
]

[build-dependencies]
winresource = "0.1"
